services:
  db:
    image: postgres:16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # schéma créé au 1er démarrage
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    # pas de "ports" : la base n'est jamais exposée hors du serveur (Docker contourne UFW)

  api:
    build: .
    env_file: .env
    ports: ["8080:8000"]
    depends_on:
      db: {condition: service_healthy}   # attend que PostgreSQL accepte les connexions
    restart: unless-stopped

volumes:
  pgdata: {}
